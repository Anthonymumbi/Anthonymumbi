version: '3.9'
services:
  api:
    build: .
    env_file: .env
    depends_on:
      - db
      - minio
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/movement?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: movement-uploads
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: password
      S3_ACL: private
      S3_PRESIGN_TTL: 900
      MAX_UPLOAD_BYTES: 5242880
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: movement
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  create-bucket:
    image: minio/mc:RELEASE.2024-11-07T00-52-20Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      mc alias set local http://minio:9000 admin password &&
      mc mb -p local/movement-uploads || true
      "
volumes:
  db-data:
  minio-data:
